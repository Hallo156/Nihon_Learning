<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="locObj.title">Gegenstand-Position</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/location-obj.css">
</head>
<body class="location-obj">
    <a href="../index.html" class="nav-back" data-i18n="nav.back">&larr; Zurück zum Menü</a>
    <div class="container location-obj-trainer">
        <h1 data-i18n="locObj.title">Gegenstand-Position</h1>

        <!-- Wiederholungs-Modus -->
        <div class="mode-toggle">
            <button id="modeRandom" class="active" data-i18n="btn.random">Zufällig</button>
            <button id="modeSemiRandom" data-i18n="btn.spaced">Wiederholung</button>
        </div>

        <!-- Fragetyp-Toggle -->
        <div class="mode-toggle" id="quizTypeToggle">
            <button id="typeBeschreiben" class="active" data-i18n="locObj.typeBeschreiben">Beschreiben</button>
            <button id="typeZeigen" data-i18n="locObj.typeZeigen">Zeigen</button>
        </div>

        <!-- SVG-Szene -->
        <div id="sceneContainer"></div>

        <!-- Anzeige: JP-Phrase (Zeigen-Modus) / Frage (Beschreiben-Modus) -->
        <div id="displayArea"></div>
        <div id="displayRomaji" class="display-romaji" style="display:none;"></div>
        <div id="displayTranslation" class="display-translation" style="display:none;"></div>
        <p id="zeigenInstruction" style="display:none;" data-i18n="locObj.clickInstruction"></p>

        <!-- Multiple-Choice-Buttons (Beschreiben-Modus) -->
        <div class="choices-area" id="choicesArea"></div>

        <!-- Feedback -->
        <div class="feedback" id="feedbackArea"></div>
        <button id="nextButton" class="next-btn" style="display:none;" data-i18n="btn.next">Nächste Frage</button>

        <!-- Score -->
        <div class="score">
            <span data-i18n="score.correct">Richtig</span>: <span id="correctCount">0</span> |
            <span data-i18n="score.incorrect">Falsch</span>: <span id="incorrectCount">0</span>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/location-obj-data.js"></script>
    <script src="../js/location-obj.js"></script>
</body>
</html>
