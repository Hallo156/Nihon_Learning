<!-- Japanisch Lernprogramm — Erstellt von Hi156 unter Verwendung von Claude (Anthropic) -->
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="transport.title">Verkehr & Fortbewegung</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/transport.css">
</head>
<body class="transport">
    <a href="../index.html" class="nav-back" data-i18n="nav.back">← Zurück zum Menü</a>

    <div class="container transport-trainer">
        <h1 data-i18n="transport.title">Verkehr & Fortbewegung</h1>

        <!-- Modus-Toggle: Zufällig / Wiederholung -->
        <div class="mode-toggle">
            <button id="modeRandom" class="active" data-i18n="btn.random">Zufällig</button>
            <button id="modeSemiRandom" data-i18n="btn.spaced">Wiederholung</button>
        </div>

        <!-- Eingabe-Modus-Toggle: Multiple Choice / Texteingabe -->
        <div class="mode-toggle" id="inputModeToggle">
            <button id="inputModeMC" class="active" data-i18n="transport.inputMC">Multiple Choice</button>
            <button id="inputModeText" data-i18n="transport.inputText">Texteingabe</button>
        </div>

        <!-- Ketten-Visualisierung -->
        <div id="chainContainer"></div>

        <!-- Frage-Bereich -->
        <div id="questionArea"></div>

        <!-- Feedback -->
        <div id="feedbackArea" class="feedback"></div>

        <!-- Weiter-Button -->
        <button id="nextButton" class="next-btn" style="display:none" data-i18n="btn.next">Nächste Frage</button>

        <!-- Score -->
        <div class="score">
            <span data-i18n="score.correct">Richtig</span>: <span id="correctCount">0</span> |
            <span data-i18n="score.incorrect">Falsch</span>: <span id="incorrectCount">0</span>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/transport-data.js"></script>
    <script src="../js/transport.js"></script>
</body>
</html>
