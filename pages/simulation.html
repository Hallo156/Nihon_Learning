<!-- Japanisch Lernprogramm — Erstellt von Hi156 unter Verwendung von Claude (Anthropic) -->
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="sim.title">Einkaufs-Simulation</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/simulation.css">
    <link rel="stylesheet" href="../css/sidebar.css">
</head>
<body class="simulation">
    <a href="../index.html" class="nav-back" data-i18n="nav.back">&larr; Zurück zum Menü</a>

    <div class="container simulation-trainer">
        <h1 data-i18n="sim.title">Einkaufs-Simulation</h1>

        <!-- Modus Toggle -->
        <div class="mode-toggle">
            <button id="modeRandom"     class="active" data-i18n="btn.random">Zufällig</button>
            <button id="modeSemiRandom"              data-i18n="btn.spaced">Wiederholung</button>
        </div>

        <!-- Eingabe-Modus Toggle (nur MC oder Text) -->
        <div class="input-mode-toggle" id="inputModeToggle">
            <button id="inputModeMC"   class="active" data-i18n="sim.inputMC">Multiple Choice</button>
            <button id="inputModeText"               data-i18n="sim.inputText">Texteingabe</button>
        </div>

        <!-- Szenen-Filter -->
        <div class="scene-filters">
            <div class="scene-filter-labels" id="sceneFilters"></div>
            <button id="applyFilter" class="filter-apply-btn" data-i18n="btn.applyFilter">Filter anwenden</button>
        </div>

        <!-- Dialog-Anzeige -->
        <div id="dialogContainer"></div>

        <!-- Feedback -->
        <div class="feedback" id="feedbackArea"></div>

        <!-- Nächste Lücke / Nächste Szene -->
        <button id="nextButton" class="next-btn" style="display:none;" data-i18n="btn.next">Nächste Frage</button>

        <!-- Score -->
        <div class="score">
            <span data-i18n="score.correct">Richtig</span>: <span id="correctCount">0</span> |
            <span data-i18n="score.incorrect">Falsch</span>: <span id="incorrectCount">0</span>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/quiz-engine.js"></script>
    <script src="../js/simulation-data.js"></script>
    <script src="../js/simulation-ref.js"></script>
    <script src="../js/simulation.js"></script>
</body>
</html>
